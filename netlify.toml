# Netlify builds this site from the repository, so it renders the dashboard
# itself rather than receiving a pre-built directory. `dist/` is generated
# output and is not committed, which is why a build with no command fails with
# "Deploy directory 'dist' does not exist".
#
# Building here means the build needs to reach the database. It is given a
# dedicated **read-only** role (jobradar_readonly) rather than the credential
# the scraper writes with: rendering a page is a pure read, so the build has no
# business holding rights it cannot use. Verified as SELECT-only --
# INSERT/UPDATE/DELETE/DROP/CREATE are all denied to it.
#
# Set DATABASE_URL in Netlify → Site configuration → Environment variables.
# Without it the build fails loudly, which is correct: publishing an empty
# dashboard would be worse than not publishing.
#
# --no-deps because Netlify has already installed requirements.txt by this
# point; this step only puts the package itself on the path.

[build]
  publish = "dist"
  command = "pip install -e . --no-deps && python -m jobradar.cli export --out dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "20"

# Redirects and headers are also emitted into dist/ by the exporter (as
# _redirects and _headers) so a bare `netlify deploy --dir=dist` carries them
# even without this file. They are repeated here so the intent is visible in
# the repo rather than only in generated output.

[[redirects]]
  from = "/api/health"
  to = "/api/health.json"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/api/stats.json"
  status = 200

[[redirects]]
  from = "/api/jobs"
  to = "/api/jobs.json"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Rebuilt after every run; a short cache keeps a visitor from being shown
    # yesterday's numbers while still absorbing repeat loads.
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"
