name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the package declares; 3.12 is what the scheduled
        # run uses. Both are tested so the floor does not quietly rot.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite runs against SQLite, so no database service is needed. The
      # dialect-sensitive paths are isolated in db.py and exercised for real by
      # the scheduled run against Postgres.
      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check src tests
